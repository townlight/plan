name: verify

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: planning_test
          POSTGRES_PASSWORD: planning_test
          POSTGRES_DB: planning_p1p2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planning_test -d planning_p1p2_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PLANNING_TEST_DATABASE_URL: postgresql+psycopg2://planning_test:planning_test@127.0.0.1:5432/planning_p1p2_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CivicCore release wheel
        run: python -m pip install https://github.com/townlight/core/archive/68eaf17240ca1af7886f044881ca1be2b2b63e51.zip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run release gate
        run: bash scripts/verify-release.sh
