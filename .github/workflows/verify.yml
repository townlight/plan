name: verify

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: planning_test
          POSTGRES_PASSWORD: planning_test
          POSTGRES_DB: planning_p1p2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planning_test -d planning_p1p2_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PLANNING_TEST_DATABASE_URL: postgresql+psycopg2://planning_test:planning_test@127.0.0.1:5432/planning_p1p2_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CivicCore release wheel
        run: python -m pip install https://github.com/townlight/core/releases/download/v1.2.1/civiccore-1.2.1-py3-none-any.whl#sha256=8dde29408e206048bde63ec14156a8e6329382af4d16b12710d12aa5c27f3f59
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run release gate
        run: bash scripts/verify-release.sh
