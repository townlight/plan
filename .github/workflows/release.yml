name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      PLANNING_TEST_DATABASE_URL: postgresql+psycopg2://planning_test:planning_test@127.0.0.1:5432/planning_p1p2_test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CivicCore release wheel
        run: python -m pip install https://github.com/townlight/core/releases/download/v1.2.1/civiccore-1.2.1-py3-none-any.whl#sha256=8dde29408e206048bde63ec14156a8e6329382af4d16b12710d12aa5c27f3f59

      - name: Start disposable PostgreSQL acceptance database
        run: |
          docker run --name planning-test-db -d -p 127.0.0.1:5432:5432 -e POSTGRES_USER=planning_test -e POSTGRES_PASSWORD=planning_test -e POSTGRES_DB=planning_p1p2_test postgres:17
          for attempt in {1..30}; do
            docker exec planning-test-db pg_isready -U planning_test -d planning_p1p2_test && exit 0
            sleep 1
          done
          exit 1

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run release verification
        run: bash scripts/verify-release.sh

      - name: Create release notes
        run: |
          cat > release-notes.md <<EOF
          CivicPlan ${{ github.ref_name }} release.

          Artifacts:
          - civicplan wheel
          - civicplan source distribution
          - SHA256SUMS.txt

          Verify locally with:

          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          bash scripts/verify-release.sh
          \`\`\`
          EOF

      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --repo "$GH_REPO" \
            --title "civicplan ${{ github.ref_name }}" \
            --notes-file release-notes.md
