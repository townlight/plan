[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "civicplan"
version = "0.4.0.dev1"
description = "Townlight Planning runtime foundation for comprehensive-plan policy lookup and cited planning analysis support."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE-CODE", "LICENSE-DOCS"]
authors = [
  { name = "CivicSuite contributors" }
]
dependencies = [
  "civiccore @ https://github.com/townlight/core/archive/68eaf17240ca1af7886f044881ca1be2b2b63e51.zip",
  "fastapi>=0.115.0,<1.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "psycopg2-binary>=2.9.0,<3.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "psycopg2-binary>=2.9.0,<3.0.0",
  "pytest>=8.0.0,<9.0.0",
  "ruff==0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["civicplan"]

[tool.hatch.build.targets.sdist]
include = [
  "civicplan",
  "scripts",
  "tests",
  "README.md",
  "README.txt",
  "CHANGELOG.md",
  "USER-MANUAL.md",
  "USER-MANUAL.txt",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "SUPPORT.md",
  "CODE_OF_CONDUCT.md",
  "AGENTS.md",
  ".github",
  "docs",
  "MILESTONE_0_7_DONE.md",
  "PRODUCTION_DEPTH_POLICY_PERSISTENCE_DONE.md",
  "PRODUCTION_DEPTH_ZONE_CONTEXT_CONTRACT_DONE.md",
  "LICENSE-CODE",
  "LICENSE-DOCS",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.metadata]
allow-direct-references = true

